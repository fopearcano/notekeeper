[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "notekeeper"
version = "0.1.0"
description = "Voice-driven notebook with live transcription and LLM-assisted note processing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Notekeeper Contributors" }]
keywords = [
    "transcription",
    "speech-to-text",
    "whisper",
    "llm",
    "lm-studio",
    "notes",
    "desktop",
    "qt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "PySide6>=6.6",
    "pydantic>=2.6",
    "httpx>=0.27",
    "sounddevice>=0.4.6",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Local speech-to-text. CUDA wheels of `ctranslate2` are pulled in
# automatically when faster-whisper is installed; see the README for the
# CPU-only and CUDA install recipes.
faster-whisper = ["faster-whisper>=1.0"]

# Build a single-file desktop executable.
packaging = ["pyinstaller>=6.0"]

dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.4",
]

# Convenience meta-extra so users can ``pip install notekeeper[full]`` to
# get the local Whisper backend without spelling each extra by hand.
full = ["faster-whisper>=1.0"]

[project.urls]
Homepage = "https://github.com/fopearcano/notekeeper"
Issues = "https://github.com/fopearcano/notekeeper/issues"
Source = "https://github.com/fopearcano/notekeeper"

[project.scripts]
notekeeper = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
# Bundle the default TOML and the application icon inside the wheel so
# ``ensure_user_config`` and ``QApplication.setWindowIcon`` work after
# ``pip install`` (no source checkout needed).
"app.config" = ["default_config.toml"]
"app.assets" = ["*.svg", "*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
