# Notekeeper default configuration.
#
# Copied to ~/.notekeeper/config.toml on first launch. Edit that copy — this
# file is overwritten by package upgrades.

[app]
name = "Notekeeper"
log_level = "INFO"

[ui]
window_title = "Notekeeper"
window_width = 1280
window_height = 800

[audio]
channels = 1
device = "default"
vad_aggressiveness = 2

[transcription]
provider = "faster_whisper"
language = "auto"
chunk_seconds = 5
sample_rate = 16000

[faster_whisper]
model = "small"
device = "cuda"
compute_type = "float16"
allow_cpu_fallback = true

[openai_audio]
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
model = "whisper-1"

[lmstudio_audio]
base_url = "http://192.168.1.100:1234/v1"
model = "whisper-local"
enabled = false

[llm]
provider = "lmstudio"
default_task = "clean"

[lmstudio]
base_url = "http://192.168.1.100:1234/v1"
api_key = "lm-studio"
model = "local-model-name"
timeout_seconds = 120

[openai]
api_key_env = "OPENAI_API_KEY"
model = "gpt-4.1-mini"

[anthropic]
api_key_env = "ANTHROPIC_API_KEY"
model = "claude-sonnet-4-5"

[storage]
database_path = "notekeeper.db"
